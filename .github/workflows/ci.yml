name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm --filter @workspace/backend exec tsc --noEmit
      - name: Run tests
        run: pnpm --filter @workspace/backend test:ci

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm --filter @workspace/frontend exec tsc --noEmit
      - name: Run tests
        run: pnpm --filter @workspace/frontend test:ci
